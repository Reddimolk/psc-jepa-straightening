# Evaluation en planification sur psc/MountainCarGoal-v0 (scripts/train/gym_goal.py, 07/10/2026).
# Succes = la POSITION du but est atteinte (angle a 0.15 rad pres pour Pendulum,
# x a 0.03 pres pour MountainCar), le but etant l'etat du dataset 25 pas plus loin.
defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: psc/MountainCarGoal-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - state

seed: 42
policy: random # ckpt name or random

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

eval:
  num_eval: 100
  goal_offset_steps: 25
  min_goal_dist: 0.1   # buts non triviaux seulement (voiture bloquee au mur)
  eval_budget: 50
  img_size: 224
  dataset_name: mountaincar/train.lance
  callables:
    - method: set_state
      args:
        state:
          value: state
    - method: set_goal_state
      args:
        goal_state:
          value: goal_state

# PSC
video: false
device: cuda

output:
  json: null
  filename: mountaincar_results.txt
